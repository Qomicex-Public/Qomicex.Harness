# Electron reuses the browser composition without its network and browser-launch rows.

- id: web-startup
  disabled: true

# The desktop transport carries the browser surface over IPC, but Host plugins
# that register local REST routes on the web server (the plugin market) need the
# route table to exist: the desktop bridge forwards those routes to this
# loopback listener. Loopback only, on an OS-assigned port.
- id: webserver
  name: '@deepseek-ai/dsh-host-webserver'
  # The web-app row injects the web-startup service this composition disables;
  # this row configures literal loopback values, so it injects nothing and
  # never waits for that provider.
  inject: []
  config:
    host: '127.0.0.1'
    port: 0

- id: web-runtime
  disabled: true

- id: client-hmr
  disabled: true

- id: open-in-app
  disabled: true

- id: ui-open-in-app
  disabled: true

- id: directory-picker
  disabled: true

- id: connection
  inject:
    - credentials
  config: {}

- insert:
    - id: directory-picker-native
      name: '@deepseek-ai/dsh-host-directory-picker-native'

    - id: ui-directory-picker-native
      name: '@deepseek-ai/dsh-client-ui-directory-picker-native'
