# Manual builder for the unsigned Windows x64 Desktop installer and its GitHub
# Release. The version is an input because the release, not the tree, is the
# published artifact: the dispatched commit keeps its committed version, the
# build rewrites it locally, and the tag marks the source state that produced
# the installer.
#
# Scope is deliberately narrow. macOS Desktop packaging resolves its Developer
# ID certificate and notary credentials while electron-builder.config.mjs loads,
# and the packaging scripts reject unsigned builds off Windows, so a
# credential-free hosted runner can emit only the Windows installer. Linux is
# not a Desktop release target (apps/desktop/README.md).
name: Build Desktop

on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号，如 0.1.6-alpha.2（不得低于当前版本；含 "-" 自动标为预发布）'
        type: string
        required: true
        default: '0.1.6-alpha.2'
      app_id:
        description: Reverse-DNS application identifier for the Desktop package.
        type: string
        required: false
        default: com.qomicex.harness

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # CI runs must never report to the production telemetry endpoint baked into
  # apps/cli/cordis.yml.
  DSH_TELEMETRY_DISABLED: '1'
  PRIMARY_NODE_VERSION: '24'

jobs:
  desktop-windows:
    name: Desktop (unsigned win-x64)
    runs-on: windows-2025
    timeout-minutes: 120
    env:
      DSH_DESKTOP_APP_ID: ${{ inputs.app_id }}
      # The update feed the packaged application reads: releases published in
      # this repository. Without it the build carries no updater metadata.
      DSH_DESKTOP_GITHUB_REPOSITORY: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          clean: true

      - name: Enable Windows Developer Mode (symlink support)
        shell: pwsh
        run: >-
          reg add "HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock"
          /t REG_DWORD /f /v "AllowDevelopmentWithoutDevLicense" /d "1"

      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm-js-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          cache: pnpm

      # node-pty and the other native addons compile here; node-gyp needs a
      # Python interpreter on PATH.
      - uses: actions/setup-python@v6.3.0
        with:
          python-version: '3.12'

      - name: Install (immutable)
        run: pnpm install --frozen-lockfile

      # A release tag must never move backwards: the updater compares versions
      # and would otherwise offer a downgrade.
      - name: Resolve the release version
        id: version
        working-directory: apps/desktop
        shell: pwsh
        run: |
          $current = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $next = "${{ inputs.version }}"
          node -e "const s=require('semver');const next=process.argv[1],current=process.argv[2];if(s.valid(next)===null)throw new Error('invalid version: '+next);if(s.lt(next,current))throw new Error(next+' is older than '+current);console.log(current+' -> '+next)" $next $current
          "current=$current" >> $env:GITHUB_OUTPUT
          "next=$next" >> $env:GITHUB_OUTPUT

      # The bump commit stays local; a hosted runner carries no git identity,
      # so configure one before the release script writes and commits versions.
      - name: Configure the release commit identity
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      # The bump stays local: publication uploads the bytes this dispatch
      # produced, and a human still owns every pushed version commit.
      - name: Write the release version
        if: steps.version.outputs.next != steps.version.outputs.current
        shell: pwsh
        run: pnpm release:dsh ${{ steps.version.outputs.next }}

      - name: Build the unsigned Windows x64 installer
        shell: pwsh
        run: pnpm run package:desktop:win:x64:unsigned

      # Only the installer and its blockmap reach the release: the updater
      # downloads the installer and uses the blockmap for differential updates.
      # The installer name comes from electron-builder's artifactName template,
      # so match every .exe and require exactly one.
      - name: Publish the installer to the GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = "${{ steps.version.outputs.next }}"
          $tag = "v$version"
          $artifacts = "apps/desktop/.desktop-build/targets/win-x64/unsigned-artifacts"
          $installers = @(Get-ChildItem "$artifacts/*.exe" -File)
          if ($installers.Count -ne 1) { throw "expected exactly one installer under $artifacts, found $($installers.Count)" }
          $installer = $installers[0]
          $assets = @($installer.FullName)
          $blockmap = "$($installer.FullName).blockmap"
          if (Test-Path $blockmap) { $assets += $blockmap }
          $create = @($tag, $assets, '--title', "Qomicex Harness $version", '--target', $env:GITHUB_SHA, '--generate-notes')
          if ($version -match '-') { $create += '--prerelease' }
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $assets --clobber
          }
          else {
            gh release create @create
          }
          gh release view $tag --json tagName,isPrerelease,url

      - uses: actions/upload-artifact@v7
        with:
          name: qomicex-harness-setup-win-x64
          path: apps/desktop/.desktop-build/targets/win-x64/unsigned-artifacts/*.exe
          if-no-files-found: error
          retention-days: 7
