# Agent preset cordis: one `@deepseek-ai/dsh-agent-preset` declaration for the
# JunSi development mode. The rows carry over from the former directory preset;
# edits saved from the Web editor override this row's `config.plugins` by id
# from the profile patch.
- insert:
    - id: preset-junsi
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: junsi
        name: 开发模式
        description: 使用 junsi-dev-toolkit 作为会话规范，适用于 Qomicex 相关项目及各类通用项目。具体功能基于标准模式拓展。
        order: 51
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              suffix: Your working directory is {{cwd}}.
              prefix: >-
                You are a helpful software engineer assistant.
                You are a coding agent powered by the {{model}} model. You carry the
                JunSi 开发模式 (junsi-dev-toolkit): route requests to the right sub-skill,
                keep decisions/progress in `.memory/`, and follow the task-completion
                checklist. Before starting, check whether the remote repo already
                implements/fixes the user's request.

          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536


          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'

          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'


          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'

          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false


          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'


          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
            config:
              customSkillDirs:
                - !!js "process.getBuiltinModule('node:path').join(process.getBuiltinModule('node:path').dirname(process.getBuiltinModule('node:module').createRequire(baseUrl).resolve('@deepseek-ai/dsh-web-app/package.json')), '../preset/agent-presets/presets/junsi/skills')"

          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'


          - id: command-goal
            name: '@deepseek-ai/dsh-command-goal'

          - id: tool-goal
            name: '@deepseek-ai/dsh-tool-goal'


          - id: planning
            name: cordis:group
            group: true
            isolate:
              planMode: true
            config:
              - id: plan-mode
                name: '@deepseek-ai/dsh-plan-mode'
                config:
                  section: |
                        You are in plan mode. Stay in plan mode until exit_plan_mode succeeds or the user switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

                        Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

                        The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed to keep the tool catalog unchanged.


          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'

              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'

              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024


          - id: delegation
            name: cordis:group
            group: true
            isolate:
              workflowEngine: true
            config:
              - id: tool-subagent-control
                name: '@deepseek-ai/dsh-tool-subagent-control'
              - id: tool-subagent-list-agents
                name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'
              - id: tool-subagent
                name: '@deepseek-ai/dsh-tool-subagent'
                config: { provider: spawn, toolName: subagent, backgroundMode: continuable }
              - id: tool-subagent-fork
                name: '@deepseek-ai/dsh-tool-subagent'
                config: { provider: fork, toolName: subagent_fork, backgroundMode: continuable }
              - id: workflow-ptc
                name: '@deepseek-ai/dsh-workflow-ptc'
              - id: tool-workflow
                name: '@deepseek-ai/dsh-tool-workflow'
              - id: tool-ralph
                name: '@deepseek-ai/dsh-tool-ralph'
                disabled: true
                config: { subagentProvider: spawn, maxRounds: 64 }


          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'

          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config: { allowParallelInProgress: true }

          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config: { fetch: true, searchTimeoutMs: 60000 }


          - id: schedule
            name: '@deepseek-ai/dsh-schedule'


          - id: memory-tools
            name: '@deepseek-ai/dsh-tool-memory'
          - id: tool-search
            name: '@deepseek-ai/dsh-tool-tool-search'
          - id: git
            name: '@deepseek-ai/dsh-tool-git'
          - id: routing
            name: '@deepseek-ai/dsh-junsi-routing'
          - id: mcp-playwright
            name: '@deepseek-ai/dsh-mcp-client'
            config:
              serverName: playwright
              transport: stdio
              command: npx
              args:
                - '@playwright/mcp@latest'
          - id: project-docs
            name: '@deepseek-ai/dsh-tool-project-docs'
